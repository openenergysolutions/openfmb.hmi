name: CI to Docker Hub
on:
  push:
    branches: [develop]
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: oesinc/openfmb.hmi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64          
          - linux/arm64
    steps:
      - name: Git sha
        uses: benjlevesque/short-sha@v2.1
        id: git-sha
        with:
          length: 8

      - name: Check Out Repo
        uses: actions/checkout@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |                        
            type=ref,event=tag
            type=raw,value=${{ steps.git-sha.outputs.sha }}                      
          labels: |
            maintainer=OES
            org.opencontainers.image.title=openfmb.hmi
            org.opencontainers.image.description=Single line diagram and HMI for OpenFMB 
            org.opencontainers.image.vendor=Open Energy Solutions, Inc
            com.openenergysolutions/signed=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ steps.git-sha.outputs.sha }}

      - name: cosign
        uses: sigstore/cosign-installer@main    

      - name: Sign Image with Cosign for sha tag
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |        
          cosign sign --yes --rekor-url "https://rekor.sigstore.dev/" ${{ env.REGISTRY_IMAGE }}:${{ steps.git-sha.outputs.sha }}
      
      - name: Verify the image signing
        run: |
          cosign verify \
          --rekor-url "https://rekor.sigstore.dev/" ${{ env.REGISTRY_IMAGE }}:${{ steps.git-sha.outputs.sha }} \
          --certificate-identity "https://github.com/openenergysolutions/${{ github.event.repository.name }}/.github/workflows/docker.yml@refs/heads/develop" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" | jq .